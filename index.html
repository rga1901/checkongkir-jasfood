</style>

<body>
  <div class="card">
    <div class="top-row">
      <h1>Cek Ongkir</h1>
      <a class="btn-jasfood" href="https://jasfood.my.id" target="_blank" rel="noopener">↗ Jasfood</a>
    </div>
    <p class="sub">Pilih salah satu cara di bawah buat lihat estimasi ongkirnya. Kolom "Paste Link Lokasi" bisa isi link Maps, koordinat, atau langsung angka km.</p>

    <div class="tabs">
      <div class="tab active" id="tabLink">Paste Link Lokasi</div>
      <div class="tab" id="tabGps">Cek Otomatis</div>
    </div>

    <!-- METODE 1: Paste link / koordinat / angka km (dipakai driver/Angga) -->
    <div class="panel active" id="panelLink">
      <div class="input-wrap">
        <textarea id="input" placeholder="Paste link Maps, koordinat (-7.1,107.9), atau angka km (misal 1.3)"></textarea>
        <button type="button" id="btnClear" title="Hapus isi">✕</button>
      </div>
      <button class="main" id="btnCheckLink">Cek Ongkir</button>
    </div>

    <!-- METODE 2: GPS langsung (dipakai pelanggan sendiri) -->
    <div class="panel" id="panelGps">
      <button class="main" id="btnCheckGps">📍 Cek Otomatis</button>
    </div>

    <div class="status" id="status"></div>

    <div class="result" id="result">
      <div class="argo" id="argoText">-</div>
      <div class="round-opt" id="roundOpt">
        <label class="round-label">
          <input type="checkbox" id="chkBulat">
        </label>
      </div>
      <div class="detail" id="detailText"></div>
      <div id="mapBox" style="display:none; height:220px; border-radius:10px; margin-top:12px; overflow:hidden;"></div>
      <div class="detail" id="viaHint" style="display:none;"></div>
      <div class="row" id="rowViaActions" style="display:none;">
        <button id="btnResetVia">↺ Reset ke rute asli</button>
      </div>
      <div class="coord" id="coordText"></div>
      <div class="row" id="rowActions" style="display:none;">
        <button id="btnCopy">Copy Koordinat</button>
        <button id="btnMaps">Buka di Maps</button>
      </div>
    </div>

    <div class="disclaimer">
      Ini estimasi berdasarkan jarak rute jalan dari toko, belum tentu 100% sama dengan ongkir final.
    </div>
  </div>

<script>
// URL Web App Apps Script — backend sendiri, terpisah dari app pelanggan
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxVodQkl0Wwv9S_okKOW1A9azKJ-MKXyncez0KEVVO0nWu8V0JkT9o53_00atgLGm95sg/exec';

const tabLink = document.getElementById('tabLink');
const tabGps = document.getElementById('tabGps');
const panelLink = document.getElementById('panelLink');
const panelGps = document.getElementById('panelGps');
const input = document.getElementById('input');
const btnClear = document.getElementById('btnClear');
const btnCheckLink = document.getElementById('btnCheckLink');
const btnCheckGps = document.getElementById('btnCheckGps');
const btnCopy = document.getElementById('btnCopy');
const btnMaps = document.getElementById('btnMaps');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const argoText = document.getElementById('argoText');
const detailText = document.getElementById('detailText');
const coordText = document.getElementById('coordText');
const mapBox = document.getElementById('mapBox');
let petaInstance = null;
let layerRute = null;
let petaKlikHandler = null;
const rowActions = document.getElementById('rowActions');
const viaHint = document.getElementById('viaHint');
const rowViaActions = document.getElementById('rowViaActions');
const btnResetVia = document.getElementById('btnResetVia');
const roundOpt = document.getElementById('roundOpt');
const chkBulat = document.getElementById('chkBulat');

let cacheToko = null;
let cacheKonf = null;
let lastCoord = null;
let ongkirAsli = null; // nilai ongkir hasil hitung asli (belum dibulatkan)

function toggleBtnClear() {
  btnClear.classList.toggle('show', input.value.trim().length > 0);
}
input.addEventListener('input', toggleBtnClear);
toggleBtnClear();

btnClear.addEventListener('click', () => {
  input.value = '';
  toggleBtnClear();
  resetResult();
  input.focus();
});

tabLink.addEventListener('click', () => {
  tabLink.classList.add('active'); tabGps.classList.remove('active');
  panelLink.classList.add('active'); panelGps.classList.remove('active');
  resetResult();
});
tabGps.addEventListener('click', () => {
  tabGps.classList.add('active'); tabLink.classList.remove('active');
  panelGps.classList.add('active'); panelLink.classList.remove('active');
  resetResult();
});

function resetResult() {
  statusEl.textContent = '';
  resultEl.classList.remove('show', 'error');
  roundOpt.style.display = 'none';
  viaHint.style.display = 'none';
  rowViaActions.style.display = 'none';
}

// ---------- Parsing koordinat dari link ----------
function tryDirectParse(text) {
  let m = text.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };

  m = text.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };

  m = text.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };

  m = text.trim().match(/^(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };

  return null;
}

function isJarakKm(text) {
  var t = text.trim().toLowerCase().replace(',', '.');
  var m = t.match(/^(\d+(\.\d+)?)\s*km$/) || t.match(/^(\d+(\.\d+)?)$/);
  if (!m) return null;
  var km = parseFloat(m[1]);
  if (isNaN(km) || km < 0) return null;
  return km;
}

async function prosesJarakManual(km) {
  statusEl.textContent = 'Mengambil tarif...';
  const konf = await ambilKonfigurasi();
  const ongkir = hitungOngkir(km, konf);

  lastCoord = null;
  ongkirAsli = ongkir;
  roundOpt.style.display = 'block';
  renderOngkir();
  detailText.textContent = `Jarak input manual: ${km.toFixed(1)} km`;
  coordText.textContent = '';
  rowActions.style.display = 'none';
  resultEl.classList.add('show');
  statusEl.textContent = '';
}

function isUrl(text) {
  return /^https?:\/\//i.test(text.trim());
}

async function resolveViaAppsScript(url) {
  const endpoint = SCRIPT_URL + '?action=resolveLink&url=' + encodeURIComponent(url);
  const res = await fetch(endpoint);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return { lat: parseFloat(data.lat), lng: parseFloat(data.lng) };
}

function ambilPosisiGps() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('HP/browser kamu tidak mendukung fitur lokasi.'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      err => reject(new Error('Gagal mengambil lokasi: ' + err.message + '. Pastikan izin lokasi diaktifkan.')),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 8000 }
    );
  });
}

// ---------- Data toko & konfigurasi (di-cache per sesi) ----------
async function ambilToko() {
  if (cacheToko) return cacheToko;
  const res = await fetch(SCRIPT_URL + '?action=getLokasiToko');
  const data = await res.json();
  if (!data.toko || !data.toko.length) throw new Error('Koordinat toko belum diisi di sheet Lokasi_Toko.');
  cacheToko = data.toko[0];
  return cacheToko;
}

async function ambilKonfigurasi() {
  if (cacheKonf) return cacheKonf;
  const res = await fetch(SCRIPT_URL + '?action=getKonfigurasi');
  const data = await res.json();
  cacheKonf = {
    tarif_per_km: Number(data.tarif_per_km) || 2000,
    ongkir_minimum: Number(data.ongkir_minimum) || 5000,
    batas_km_flat: Number(data.batas_km_flat) || 2,
    ongkir_flat: Number(data.ongkir_flat) || 3000
  };
  return cacheKonf;
}

async function hitungRute(toko, tujuan, viaPoint) {
  const titik = [toko, ...(viaPoint ? [viaPoint] : []), tujuan]
    .map(t => `${t.lng},${t.lat}`)
    .join(';');
  const url = `https://router.project-osrm.org/route/v1/driving/${titik}?overview=full&geometries=geojson`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.routes || !data.routes.length) throw new Error('Tidak bisa menghitung rute.');
  const rute = data.routes[0];
  return {
    km: rute.distance / 1000,
    // geometry.coordinates formatnya [lng, lat] - dibalik jadi [lat, lng]
    titikRute: rute.geometry.coordinates.map(c => [c[1], c[0]])
  };
}

function hitungOngkir(km, konf) {
  if (km < konf.batas_km_flat) return konf.ongkir_flat;
  return Math.max(km * konf.tarif_per_km, konf.ongkir_minimum);
}

function formatRupiah(angka) {
  return 'Rp' + Math.round(angka).toLocaleString('id-ID');
}

// ---------- Pembulatan ongkir (tampilan saja, tidak mengubah rumus asli) ----------
function bulatkanOngkir(angka) {
  const dasar = Math.floor(angka / 1000) * 1000;
  const sisa = angka - dasar;
  return sisa < 500 ? dasar : dasar + 1000;
}

function renderOngkir() {
  if (ongkirAsli === null) return;
  if (chkBulat.checked) {
    const dibulatkan = bulatkanOngkir(ongkirAsli);
    argoText.textContent = formatRupiah(dibulatkan);
  } else {
    argoText.textContent = formatRupiah(ongkirAsli);
  }
}

chkBulat.addEventListener('change', renderOngkir);

function tampilkanPeta(toko, tujuan, titikRute, opsi) {
  mapBox.style.display = 'block';

  // Inisialisasi peta cuma sekali; kunjungan berikutnya tinggal update isinya
  if (!petaInstance) {
    petaInstance = L.map(mapBox);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(petaInstance);
  }

  if (layerRute) { petaInstance.removeLayer(layerRute); }
  if (petaKlikHandler) { petaInstance.off('click', petaKlikHandler); petaKlikHandler = null; }

  // Pin custom dari CSS doang (bukan gambar dari CDN luar) - biar gak mungkin
  // gagal muat kayak masalah peta statis sebelumnya. Biru = toko, merah = tujuan.
  function buatPin(warna) {
    return L.divIcon({
      className: '',
      html: `<div style="width:20px; height:20px; border-radius:50% 50% 50% 0; background:${warna}; transform:rotate(-45deg); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>`,
      iconSize: [20, 20],
      iconAnchor: [10, 20],
      popupAnchor: [0, -20]
    });
  }

  const garisRute = L.polyline(titikRute, { color: '#7a1f2b', weight: 4 });
  const markerToko = L.marker([toko.lat, toko.lng], { icon: buatPin('#2196f3') }).bindPopup((toko.nama || 'Toko') + ' (toko)');
  const markerTujuan = L.marker([tujuan.lat, tujuan.lng], { icon: buatPin('#e0392b') }).bindPopup('Tujuan');
  const semuaLayer = [garisRute, markerToko, markerTujuan];

  if (opsi && opsi.viaPoint) {
    const markerVia = L.marker([opsi.viaPoint.lat, opsi.viaPoint.lng], { icon: buatPin('#ffb300') })
      .bindPopup('Titik koreksi rute');
    semuaLayer.push(markerVia);
  }

  layerRute = L.layerGroup(semuaLayer).addTo(petaInstance);

  mapBox.classList.toggle('klik-aktif', !!(opsi && opsi.bisaKlikPeta));

  if (opsi && opsi.bisaKlikPeta) {
    petaKlikHandler = (e) => opsi.onKlikPeta({ lat: e.latlng.lat, lng: e.latlng.lng });
    petaInstance.on('click', petaKlikHandler);
  }

  // Leaflet butuh tau ukuran kontainer yang BENAR dulu (yang tadinya display:none)
  // sebelum baru boleh fitBounds - kalau kebalik, zoom-nya salah hitung dan hasilnya
  // zoom-out kejauhan kayak yang dialami Angga.
  setTimeout(() => {
    petaInstance.invalidateSize();
    petaInstance.fitBounds(garisRute.getBounds(), { padding: [20, 20] });
  }, 150);

}

// ---------- Alur bareng: dari koordinat tujuan -> tampilkan hasil ----------
let rutePakaiSekarang = null; // { toko, tujuan, konf, viaPoint, km, titikRute, bisaKoreksi } - buat handle klik koreksi rute

async function hitungUlangRute() {
  const { toko, tujuan, viaPoint } = rutePakaiSekarang;
  const { km, titikRute } = await hitungRute(toko, tujuan, viaPoint);
  rutePakaiSekarang.km = km;
  rutePakaiSekarang.titikRute = titikRute;
}

function renderHasilRute() {
  const { toko, konf, km, viaPoint } = rutePakaiSekarang;
  const ongkir = hitungOngkir(km, konf);

  ongkirAsli = ongkir;
  renderOngkir();
  detailText.textContent = `Jarak ± ${km.toFixed(1)} km dari ${toko.nama || 'toko'}`;

  if (viaPoint) {
    viaHint.style.display = 'block';
    viaHint.textContent = 'Rute dikoreksi manual lewat titik yang dipilih di peta.';
    rowViaActions.style.display = 'flex';
  } else {
    viaHint.style.display = 'none';
    rowViaActions.style.display = 'none';
  }
}

async function prosesTujuan(tujuan, tampilkanAksi, bisaKoreksi) {
  statusEl.textContent = 'Mengambil data toko & tarif...';
  const [toko, konf] = await Promise.all([ambilToko(), ambilKonfigurasi()]);

  statusEl.textContent = 'Menghitung jarak & rute...';
  const { km, titikRute } = await hitungRute(toko, tujuan, null);

  rutePakaiSekarang = { toko, tujuan, konf, viaPoint: null, km, titikRute, bisaKoreksi };

  lastCoord = `${tujuan.lat},${tujuan.lng}`;
  roundOpt.style.display = 'block';
  renderHasilRute();
  coordText.textContent = tampilkanAksi ? ('Koordinat: ' + lastCoord) : '';
  rowActions.style.display = tampilkanAksi ? 'flex' : 'none';
  if (bisaKoreksi) statusEl.textContent = 'Rute keliatan salah? Klik titik di peta buat perbaiki jalurnya.';

  gambarUlangPeta();

  resultEl.classList.add('show');
}

function gambarUlangPeta() {
  const { toko, tujuan, titikRute, viaPoint, bisaKoreksi } = rutePakaiSekarang;
  tampilkanPeta(toko, tujuan, titikRute, {
    viaPoint,
    bisaKlikPeta: !!bisaKoreksi,
    onKlikPeta: async (titik) => {
      rutePakaiSekarang.viaPoint = titik;
      statusEl.textContent = 'Menghitung ulang rute...';
      try {
        await hitungUlangRute();
        renderHasilRute();
        gambarUlangPeta();
        statusEl.textContent = '';
      } catch (err) {
        statusEl.textContent = 'Gagal menghitung ulang: ' + err.message;
      }
    }
  });
}

btnResetVia.addEventListener('click', async () => {
  if (!rutePakaiSekarang) return;
  rutePakaiSekarang.viaPoint = null;
  statusEl.textContent = 'Menghitung ulang rute...';
  try {
    await hitungUlangRute();
    renderHasilRute();
    gambarUlangPeta();
    statusEl.textContent = 'Rute keliatan salah? Klik titik di peta buat perbaiki jalurnya.';
  } catch (err) {
    statusEl.textContent = 'Gagal menghitung ulang: ' + err.message;
  }
});

function tampilkanError(err) {
  resultEl.classList.add('show', 'error');
  ongkirAsli = null;
  roundOpt.style.display = 'none';
  viaHint.style.display = 'none';
  rowViaActions.style.display = 'none';
  argoText.textContent = 'Gagal menghitung';
  detailText.textContent = err.message;
  coordText.textContent = '';
  rowActions.style.display = 'none';
  mapBox.style.display = 'none';
}

// ---------- Metode 1: paste link ----------
btnCheckLink.addEventListener('click', async () => {
  const text = input.value.trim();
  resetResult();
  if (!text) { statusEl.textContent = 'Paste dulu link atau koordinatnya.'; return; }

  btnCheckLink.disabled = true;
  try {
    const km = isJarakKm(text);
    if (km !== null) {
      await prosesJarakManual(km);
      return;
    }

    let tujuan = tryDirectParse(text);
    if (!tujuan && isUrl(text)) {
      statusEl.textContent = 'Membongkar link...';
      tujuan = await resolveViaAppsScript(text);
    }
    if (!tujuan) throw new Error('Koordinat tidak ditemukan dari link/teks ini.');
    await prosesTujuan(tujuan, true, true);
  } catch (err) {
    tampilkanError(err);
  } finally {
    btnCheckLink.disabled = false;
  }
});

// ---------- Metode 2: bagikan lokasi GPS ----------
btnCheckGps.addEventListener('click', async () => {
  resetResult();
  btnCheckGps.disabled = true;
  try {
    statusEl.textContent = 'Mengambil lokasimu...';
    const posisi = await ambilPosisiGps();
    await prosesTujuan(posisi, false, false);
  } catch (err) {
    tampilkanError(err);
  } finally {
    btnCheckGps.disabled = false;
  }
});

btnCopy.addEventListener('click', () => {
  if (!lastCoord) return;
  navigator.clipboard.writeText(lastCoord).then(() => {
    statusEl.textContent = 'Koordinat udah ke-copy!';
    setTimeout(() => statusEl.textContent = '', 2000);
  });
});

btnMaps.addEventListener('click', () => {
  if (!lastCoord) return;
  window.open(`https://www.google.com/maps?q=${lastCoord}`, '_blank');
});
